name: Monitorar Mediador

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/results.json'
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'

concurrency:
  group: alerta-dissidio-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Guardar resultado anterior
        run: |
          if [ -f data/results.json ]; then cp data/results.json /tmp/previous-results.json; else echo '{"pairs":[]}' > /tmp/previous-results.json; fi

      - name: Consultar Mediador
        run: node scripts/monitor-mediador.mjs

      - name: Enviar alertas por e-mail
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTA_FROM_EMAIL: ${{ secrets.ALERTA_FROM_EMAIL }}
          ALERTA_EMAILS: ${{ secrets.ALERTA_EMAILS }}
        run: node scripts/send-email-alerts.mjs /tmp/previous-results.json

      - name: Publicar resultado do teste
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ github.run_number }}
          path: data/results.json
          if-no-files-found: error
          retention-days: 14

      - name: Persistir histórico
        run: |
          git config user.name 'Alerta Dissídio Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/results.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: atualizar monitoramento do Mediador'
          git push origin HEAD:main
