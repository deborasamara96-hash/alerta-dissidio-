name: Monitorar Mediador MTE
on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * *'
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run monitor
      - name: Gravar resultado
        run: |
          git config user.name 'Alerta Dissídio Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/results.json
          git diff --cached --quiet || git commit -m 'chore: atualizar monitoramento Mediador'
          git push
